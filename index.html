<body>
<canvas id="scene" aria-hidden="true"></canvas>
<header class="masthead">
  <h1><span>THE</span> AETHER WORKS</h1>
  <p class="sub">Michael Denyer · genomics &amp; data engineering</p>
  <nav aria-label="Michael's projects">
    <a href="https://github.com/michael-denyer">GitHub</a>
    <a href="https://github.com/michael-denyer/pyLocusZoom">pyLocusZoom</a>
    <a href="https://github.com/michael-denyer/jamma">jamma</a>
  </nav>
</header>
<div class="controls" role="group" aria-label="Workshop controls">
  <button id="mode" title="Flip the gas lamps" aria-label="Night lighting" aria-pressed="false"><span aria-hidden="true">◐</span></button>
  <button id="sfx" title="Workshop sounds" aria-label="Workshop sounds" aria-pressed="true"><span aria-hidden="true">♪</span></button>
  <button id="motion" title="Pause the machinery" aria-label="Pause animation" aria-pressed="false"><span class="motion-icon" aria-hidden="true">Ⅱ</span></button>
</div>
<p class="hint">Pet the crew. Pull the whistle. Keep the works running.</p>
<div class="room-navigation">
  <label for="room-position">Explore the workshop</label>
  <input id="room-position" type="range" min="0" max="100" value="50" aria-label="Workshop view, furnace on the left, boilers on the right" />
</div>
<noscript>
  <p class="nojs">The workshop runs on JavaScript — but the cats are still in there:
  <a href="https://github.com/michael-denyer">github.com/michael-denyer</a></p>
</noscript>
<script type="module" src="js/main.js?v=1424d2a11c5c"></script>
